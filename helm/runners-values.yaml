# ARC runner scale set — DinD sidecar mode
# https://github.com/actions/actions-runner-controller
#
# Install (githubConfigUrl and maxRunners set via --set in setup.sh):
#   helm upgrade --install arc-runners \
#     --namespace arc-runners --create-namespace \
#     --set "githubConfigUrl=https://github.com/YOUR_ORG" \
#     --set "maxRunners=10" \
#     -f helm/runners-values.yaml \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

# Secret created by setup.sh
githubConfigSecret: arc-github-secret

scaleSetLabels:
  - self-hosted
  - linux

template:
  spec:
    securityContext:
      fsGroup: 123
    initContainers:
      - name: init-dind-externals
        image: azuradara/guarc:latest
        imagePullPolicy: IfNotPresent
        command: ['cp', '-r', '-v', '/home/runner/externals/.', '/home/runner/tmpDir/']
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: azuradara/guarc:latest
        imagePullPolicy: IfNotPresent
        command: ['/home/runner/run.sh']
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: AGENT_TOOLSDIRECTORY
            value: /opt/hostedtoolcache
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: composer-cache
            mountPath: /home/runner/.composer/cache
          - name: npm-cache
            mountPath: /home/runner/.npm
          - name: pnpm-store
            mountPath: /home/runner/.local/share/pnpm/store
          - name: tool-cache
            mountPath: /opt/hostedtoolcache
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=123
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: composer-cache
        hostPath:
          path: /var/cache/arc/composer
          type: DirectoryOrCreate
      - name: npm-cache
        hostPath:
          path: /var/cache/arc/npm
          type: DirectoryOrCreate
      - name: pnpm-store
        hostPath:
          path: /var/cache/arc/pnpm
          type: DirectoryOrCreate
      - name: tool-cache
        hostPath:
          path: /var/cache/arc/hostedtoolcache
          type: DirectoryOrCreate
